<div class="script-console">
  <div class="editor-section border-bottom">
    <div class="section-label">
      INPUT (TYPESCRIPT)
    </div>
    <div class="code-editor-container">
      <app-code-editor
        [ngModel]="scriptInput()"
        (ngModelChange)="scriptInput.set($event)"
      ></app-code-editor>
    </div>
  </div>

  <div class="button-section">
    <button class="btn btn-success fw-semibold w-100 py-3" (click)="runScript()">
      RUN
    </button>
  </div>

  <div class="output-section">
    <div class="section-label">
      OUTPUT
    </div>
    <div class="output-editor-container">
      <app-code-editor
        [ngModel]="scriptOutput()"
        (ngModelChange)="scriptOutput.set($event)"
        [readonly]="true"
        theme="light"
      ></app-code-editor>
    </div>
  </div>
</div>
