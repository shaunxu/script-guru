app:
  version: 1.0.0
  id: 1b42618f-b50c-4fae-8f6d-a881b42b6bc0
extensions:
  - key: app-admin-console
    resource: admin-console
    target: pcm:global:app:setting
    resolver:
      function: resolver
    title: CONSOLE
  - key: app-setting
    resource: admin
    target: pcm:global:app:setting
    resolver:
      function: resolver
    title: ADMIN
  - key: pcm-pjm-workitem-area
    resource: tiles
    target: pcm:pjm:workitem:area
    resolver:
      function: resolver
    title: "TILES"
functions:
  - key: resolver
    handler: index.resolver
  - key: system-trigger-handler
    handler: handlers/index.handle
resources:
  - key: admin-console
    path: web/admin-console/dist
  - key: admin
    path: web/admin/dist
  - key: tiles
    path: web/tiles/dist
permissions:
  content:
    scripts:
      - unsafe-inline
    styles:
      - unsafe-inline
  scopes:
    - pcp:storage:app
    - pcp:read:pjm:workitem
    - pcp:write:pjm:workitem
    - pcp:read:pjm:configuration
    - pcp:read:pjm:sprint
    - pcp:read:pjm:release
    - pcp:read:pjm:board
    - pcp:read:pjm:board
event:
  triggers:
    - key: system-trigger
      type: system
      events:
        - pce:pjm:workitem:created
        - pce:pjm:workitem:updated
        - pce:pjm:workitem:viewed
        - pce:pjm:workitem:deleted
        - pce:pjm:workitem:link:added
        - pce:pjm:workitem:link:removed
        - pce:pjm:workitem:comment:created
        - pce:pjm:configuration:field:created
        - pce:pjm:configuration:workitemtype:created
      filter:
        ignoreSelf: true
      handler:
        function: system-trigger-handler
storage:
  entities:
    - name: snippets
      attributes:
        - name: id
          type: string
          required: true
        - name: title
          type: string
          required: true
        - name: parameters
          type: array
          required: true
          default: []
        - name: code
          type: string
          required: true
      indexes:
        - name: id_1
          keys:
            - id: 1
          options:
            unique: true
        - name: title_1
          keys:
            - title: 1
          options:
            unique: true
    - name: automations
      attributes:
        - name: id
          type: string
          required: true
        - name: title
          type: string
          required: true
        - name: enabled
          type: boolean
          required: true
        - name: event
          type: string
          required: true
        - name: code
          type: string
          required: true
        - name: n_executed
          type: number
          required: true
          default: 0
        - name: last_executed_at
          type: number
          required: false
        - name: last_executed_status
          type: string
          required: false
      indexes:
        - name: id_1
          keys:
            - id: 1
          options:
            unique: true
        - name: title_1
          keys:
            - title: 1
          options:
            unique: true
        - name: event_1_enabled_1
          keys:
            - event: 1
            - enabled: 1
    - name: automation_executions
      attributes:
        - name: id
          type: string
          required: true
        - name: automation_id
          type: string
          required: true
        - name: event
          type: object
          required: true
        - name: executed_at
          type: number
          required: true
        - name: status
          type: string
          required: true
        - name: result
          type: object
          required: false
        - name: error
          type: object
          required: false
      indexes:
        - name: id_1
          keys:
            - id: 1
          options:
            unique: true
        - name: automation_id_1
          keys:
            - automation_id: 1
    - name: tiles
      attributes:
        - name: id
          type: string
          required: true
        - name: name
          type: string
          required: true
        - name: description
          type: string
          required: false
        - name: target
          type: string
          required: true
        - name: enabled
          type: boolean
          required: true
        # depreciated
        - name: code-frontend
          type: string
          required: false
        # depreciated
        - name: code-backend
          type: string
          required: false
        - name: html
          type: string
          required: false
      indexes:
        - name: id_1
          keys:
            - id: 1
          options:
            unique: true
        - name: target_1
          keys:
            - target: 1
