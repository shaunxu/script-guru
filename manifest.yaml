app:
  version: 1.0.0
  id: 1b42618f-b50c-4fae-8f6d-a881b42b6bc0
extensions:
  - key: app-hub
    resource: main
    target: pcm:global:app:hub
    resolver:
      function: resolver
    title: Script Guru
functions:
  - key: resolver
    handler: index.resolver
  - key: system-trigger-handler
    handler: handlers/index.handle
resources:
  - key: main
    path: web/hello-world/dist
permissions:
  content:
    scripts:
      - unsafe-inline
    styles:
      - unsafe-inline
  scopes:
    - pcp:storage:app
    - pcp:read:pjm:workitem
    - pcp:write:pjm:workitem
    - pcp:read:pjm:configuration
    - pcp:read:pjm:sprint
    - pcp:read:pjm:release
    - pcp:read:pjm:board
    - pcp:read:pjm:board
event:
  triggers:
    - key: system-trigger
      type: system
      events:
        # pjm workitem
        - pce:pjm:workitem:created
        - pce:pjm:workitem:updated
        - pce:pjm:workitem:viewed
        - pce:pjm:workitem:deleted
        - pce:pjm:workitem:link:added
        - pce:pjm:workitem:link:removed
        - pce:pjm:workitem:comment:created
        - pce:pjm:configuration:field:created
        - pce:pjm:configuration:workitemtype:created
      filter:
        ignoreSelf: true
      handler:
        function: system-trigger-handler
storage:
  entities:
    - name: snippets
      attributes:
        - name: id
          type: string
          required: true
        - name: title
          type: string
          required: true
        - name: parameters
          type: array
          required: true
          default: []
        - name: code
          type: string
          required: true
      indexes:
        - name: id_1
          keys:
            - id: 1
          options:
            unique: true
        - name: title_1
          keys:
            - title: 1
          options:
            unique: true
    - name: automations
      attributes:
        - name: id
          type: string
          required: true
        - name: title
          type: string
          required: true
        - name: enabled
          type: boolean
          required: true
        - name: event
          type: string
          required: true
        - name: code
          type: string
          required: true
      indexes:
        - name: id_1
          keys:
            - id: 1
          options:
            unique: true
        - name: title_1
          keys:
            - title: 1
          options:
            unique: true
        - name: event_1_enabled_1
          keys:
            - event: 1
            - enabled: 1